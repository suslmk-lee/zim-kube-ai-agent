apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ai-agent
  namespace: default
  labels:
    app: k8s-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-ai-agent
  template:
    metadata:
      labels:
        app: k8s-ai-agent
    spec:
      serviceAccountName: k8s-ai-agent-sa
      containers:
      - name: k8s-ai-agent
        image: k8s-ai-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: k8s-ai-agent-config
        - secretRef:
            name: k8s-ai-agent-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-ai-agent
  namespace: default
spec:
  selector:
    app: k8s-ai-agent
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
