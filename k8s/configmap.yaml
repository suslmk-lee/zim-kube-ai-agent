apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-ai-agent-config
  namespace: default
data:
  # 실제 배포 시에는 이 값들을 적절히 변경해야 합니다
  USE_NEO4J: "false"
  # Neo4j 설정은 필요한 경우에만 사용
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  # Kubernetes 설정
  # 서비스 계정을 사용하므로 KUBECONFIG_PATH는 비워둡니다
  KUBECONFIG_PATH: ""
